<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f5ff;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .probability {
            color: #555;
            font-size: 16px;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            background: #ffe5e5;
            color: #c00;
            border-radius: 8px;
            text-align: center;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Placement Predictor</h1>

        <p class="subtitle">
            KNN Machine Learning Model
        </p>

        <form action="/predict" method="POST">

            <div class="form-group">
                <label for="cgpa">CGPA</label>

                <input
                    type="number"
                    id="cgpa"
                    name="cgpa"
                    step="0.01"
                    min="0"
                    max="10"
                    placeholder="Enter CGPA"
                    required
                    value="{{ cgpa if cgpa else '' }}"
                >
            </div>


            <div class="form-group">
                <label for="iq">IQ</label>

                <input
                    type="number"
                    id="iq"
                    name="iq"
                    step="1"
                    placeholder="Enter IQ"
                    required
                    value="{{ iq if iq else '' }}"
                >
            </div>


            <div class="form-group">
                <label for="profile_score">Profile Score</label>

                <input
                    type="number"
                    id="profile_score"
                    name="profile_score"
                    step="1"
                    min="0"
                    max="100"
                    placeholder="Enter Profile Score"
                    required
                    value="{{ profile_score if profile_score else '' }}"
                >
            </div>


            <button type="submit">
                Predict Placement
            </button>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>{{ prediction }}</h2>

            {% if probability %}
            <p class="probability">
                Placement Probability:
                <strong>{{ "%.2f"|format(probability) }}%</strong>
            </p>
            {% endif %}

        </div>

        {% endif %}


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <div class="footer">
            Student Placement Prediction System
        </div>

    </div>

</body>

</html>
